<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed; z-index:9999;
      left:50%; bottom:24px; transform:translateX(-50%);
      padding:16px 26px; border-radius:14px; border:none;
      font-size:16px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
      color:#fff; background:linear-gradient(135deg,#ff7a18,#ff3d81);
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      cursor:pointer; animation:pulse 1.8s infinite;
    }
    @keyframes pulse{
      0%{transform:translateX(-50%) scale(1);}
      50%{transform:translateX(-50%) scale(1.06);}
      100%{transform:translateX(-50%) scale(1);}
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">
<button id="startBtn">Tap to Start</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true"
>
  <a-assets>
    <!-- thumbs -->
    <img id="thumb0" src="./assets/Son-Thumb.png" />
    <img id="thumb1" src="./assets/Bao-Thumb.png" />
    <img id="thumb2" src="./assets/Dien-Thumbs.png" />
    <img id="thumb3" src="./assets/Dung-thumb.png" />
    <img id="thumb4" src="./assets/Duy-Thumb.png" />
    <img id="thumb5" src="./assets/Kiet-Thumb.png" />
    <img id="thumb6" src="./assets/Minh-Thumb.png" />
    <img id="thumb7" src="./assets/Phong-Thumb.png" />
    <img id="thumb8" src="./assets/Tin-Thumb.png" />
    <img id="thumb9" src="./assets/Van-Thumb.png" />
    <img id="thumb10" src="./assets/Xo-Thumb.png" />

    <!-- videos -->
    <video id="vid0" src="./assets/phoma01.mp4" loop muted playsinline></video>
    <video id="vid1" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid2" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid3" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid4" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid5" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid6" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid7" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid8" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid9" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid10" src="./assets/target.mp4" loop muted playsinline></video>

    <!-- TARGET 0 sequences -->
    <!-- t1 -->
    <img id="t0_f0" src="./assets/t1-seq/frame_000.png" />
    <img id="t0_f1" src="./assets/t1-seq/frame_001.png" />
    <!-- t2 -->
    <img id="t2_f0" src="./assets/t2-seq/frame_000.png" />
    <img id="t2_f1" src="./assets/t2-seq/frame_001.png" />
    <!-- t3 -->
    <img id="t3_f0" src="./assets/t3-seq/frame_000.png" />
    <img id="t3_f1" src="./assets/t3-seq/frame_001.png" />
    <img id="t3_f2" src="./assets/t3-seq/frame_002.png" />
    <!-- t4 -->
    <img id="t4_f0" src="./assets/t4-seq/frame_000.png" />
    <img id="t4_f1" src="./assets/t4-seq/frame_001.png" />
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- TARGET 0 -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0">
    <a-image id="thumbPlane0" src="#thumb0" position="0 0 0.090" width="1" height="2"
      material="shader:flat; transparent:true"></a-image>

    <a-image id="seqPlane0" src="#t0_f0" position="0 0 0.094" width="1" height="2"
      material="shader:flat; transparent:true; depthWrite:false" visible="false"></a-image>

    <a-image id="seqPlane0_b" src="#t2_f0" position="0 0 0.096" width="1" height="2"
      material="shader:flat; transparent:true; depthWrite:false" visible="false"></a-image>

    <a-image id="seqPlane0_c" src="#t3_f0" position="0 0 0.098" width="1" height="2"
      material="shader:flat; transparent:true; depthWrite:false" visible="false"></a-image>

    <a-image id="seqPlane0_d" src="#t4_f0" position="0 0 0.100" width="1" height="2"
      material="shader:flat; transparent:true; depthWrite:false" visible="false"></a-image>

    <!-- FIX: video phải ở trước camera -->
    <a-video id="videoPlane0" src="#vid0" position="0 0 0.102" width="1" height="2"
      material="shader:flat" visible="false"></a-video>
  </a-entity>

  <!-- TARGETS 1..10 -->
  <a-entity id="t1" mindar-image-target="targetIndex:1">
    <a-image id="thumbPlane1" src="#thumb1" position="0 0 0.09" width="1" height="2"
      material="shader:flat; transparent:true"></a-image>
    <a-video id="videoPlane1" src="#vid1" position="0 0 0.1" width="1" height="2"
      material="shader:flat" visible="false"></a-video>
  </a-entity>

  <!-- copy same pattern for t2..t10 -->
</a-scene>

<script>
const btn = document.getElementById('startBtn');

const videos = [...Array(11)].map((_,i)=>document.getElementById(`vid${i}`));
const targets = [...Array(11)].map((_,i)=>document.getElementById(`t${i}`));
const thumbs  = [...Array(11)].map((_,i)=>document.getElementById(`thumbPlane${i}`));
const videosP = [...Array(11)].map((_,i)=>document.getElementById(`videoPlane${i}`));

const seqA = document.getElementById('seqPlane0');
const seqB = document.getElementById('seqPlane0_b');
const seqC = document.getElementById('seqPlane0_c');
const seqD = document.getElementById('seqPlane0_d');

const f1 = ['#t0_f0','#t0_f1'];
const f2 = ['#t2_f0','#t2_f1'];
const f3 = ['#t3_f0','#t3_f1','#t3_f2'];
const f4 = ['#t4_f0','#t4_f1'];

let idx=0, timer=null;

function startSeq(){
  if(timer) return;
  [seqA,seqB,seqC,seqD].forEach(p=>p&&p.setAttribute('visible',true));
  timer=setInterval(()=>{
    idx++;
    seqA?.setAttribute('src',f1[idx%f1.length]);
    seqB?.setAttribute('src',f2[idx%f2.length]);
    seqC?.setAttribute('src',f3[idx%f3.length]);
    seqD?.setAttribute('src',f4[idx%f4.length]);
  },500);
}

function stopSeq(){
  clearInterval(timer); timer=null; idx=0;
  seqA?.setAttribute('visible',false);
  seqB?.setAttribute('visible',false);
  seqC?.setAttribute('visible',false);
  seqD?.setAttribute('visible',false);
}

function showThumb(i){
  thumbs[i]?.setAttribute('visible',true);
  videosP[i]?.setAttribute('visible',false);
  i===0?startSeq():stopSeq();
}

function showVideo(i){
  thumbs[i]?.setAttribute('visible',false);
  videosP[i]?.setAttribute('visible',true);
  if(i===0) stopSeq();
}

let unlocked=false;
btn.onclick=async()=>{
  if(unlocked) return;
  unlocked=true;
  for(const v of videos){try{await v.play();v.pause();v.currentTime=0;}catch{}}
  btn.remove();
};

targets.forEach((t,i)=>{
  if(!t) return;
  const v=videos[i];
  v?.addEventListener('playing',()=>showVideo(i));
  v?.addEventListener('pause',()=>showThumb(i));
  t.addEventListener('targetFound',()=>unlocked&&showThumb(i));
  t.addEventListener('targetLost',()=>{v?.pause();showThumb(i);});
});
</script>
</body>
</html>
