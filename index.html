<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    /* ===== Loading overlay ===== */
    #loadingOverlay{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      background:rgba(0,0,0,.72);
      z-index:10000;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
    }
    #loadingCard{
      width:min(520px, calc(100vw - 32px));
      border-radius:18px;
      padding:18px 18px 16px;
      background:rgba(20,20,24,.86);
      box-shadow:0 12px 40px rgba(0,0,0,.45);
      border:1px solid rgba(255,255,255,.08);
    }
    #loadingTitle{
      font:800 14px/1.2 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      letter-spacing:.5px;
      text-transform:uppercase;
      color:#fff;
      margin:0 0 10px;
      opacity:.92;
    }
    #loadingSub{
      font:600 12px/1.3 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:rgba(255,255,255,.75);
      margin:0 0 12px;
    }
    #barWrap{
      height:12px;
      border-radius:999px;
      background:rgba(255,255,255,.10);
      overflow:hidden;
    }
    #bar{
      height:100%;
      width:0%;
      border-radius:999px;
      background:linear-gradient(135deg,#ff7a18,#ff3d81);
      transition:width 200ms ease;
    }
    #pct{
      margin-top:10px;
      font:800 12px/1 system-ui, -apple-system, Segoe UI, Roboto, Arial;
      color:rgba(255,255,255,.85);
      letter-spacing:.4px;
    }

    /* ===== Start button ===== */
    #startBtn{
      position:fixed; z-index:9999;
      left:50%; bottom:24px; transform:translateX(-50%);
      padding:16px 26px; border-radius:14px; border:none;
      font-size:16px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
      color:#fff; background:linear-gradient(135deg,#ff7a18,#ff3d81);
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      cursor:pointer; animation:pulse 1.8s infinite;
      -webkit-tap-highlight-color:transparent;
      transition:opacity 200ms ease;
      display:none; /* ✅ hidden until loading done */
    }
    @keyframes pulse{
      0%{transform:translateX(-50%) scale(1);}
      50%{transform:translateX(-50%) scale(1.06);}
      100%{transform:translateX(-50%) scale(1);}
    }
    #startBtn:active{transform:translateX(-50%) scale(.97);}
  </style>
</head>

<body style="margin:0; overflow:hidden;">

  <!-- ✅ Loading overlay -->
  <div id="loadingOverlay">
    <div id="loadingCard">
      <p id="loadingTitle">Loading AR Assets</p>
      <p id="loadingSub">Please wait…</p>
      <div id="barWrap"><div id="bar"></div></div>
      <div id="pct">0%</div>
    </div>
  </div>

  <button id="startBtn" type="button">Tap to Start</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="colorManagement:true"
  >
    <a-assets>
      <!-- thumbs -->
      <img id="thumb0"  src="./assets/Son-Thumb.png" crossorigin="anonymous" />
      <img id="thumb1"  src="./assets/Bao-Thumb.png" crossorigin="anonymous" />
      <img id="thumb2"  src="./assets/Dien-Thumbs.png" crossorigin="anonymous" />
      <img id="thumb3"  src="./assets/Dung-thumb.png" crossorigin="anonymous" />
      <img id="thumb4"  src="./assets/Duy-Thumb.png" crossorigin="anonymous" />
      <img id="thumb5"  src="./assets/Kiet-Thumb.png" crossorigin="anonymous" />
      <img id="thumb6"  src="./assets/Minh-Thumb.png" crossorigin="anonymous" />
      <img id="thumb7"  src="./assets/Phong-Thumb.png" crossorigin="anonymous" />
      <img id="thumb8"  src="./assets/Tin-Thumb.png" crossorigin="anonymous" />
      <img id="thumb9"  src="./assets/Van-Thumb.png" crossorigin="anonymous" />
      <img id="thumb10" src="./assets/Xo-Thumb.png" crossorigin="anonymous" />

      <!-- videos (✅ SOUND ENABLED: removed muted) -->
      <video id="vid0"  src="./assets/phoma01.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid1"  src="./assets/Bao.mp4"   preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid2"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid3"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid4"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid5"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid6"  src="./assets/Minh.mp4"  preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid7"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid8"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid9"  src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid10" src="./assets/target.mp4" preload="auto" loop playsinline webkit-playsinline crossorigin="anonymous"></video>

      <!-- ===== Sequences used for TARGET 0 layers ===== -->

      <!-- t1-seq (2 frames) -->
      <img id="t1_f0" src="./assets/t1-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t1_f1" src="./assets/t1-seq/frame_001.png" crossorigin="anonymous" />

      <!-- t2-seq (2 frames) -->
      <img id="t2_f0" src="./assets/t2-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t2_f1" src="./assets/t2-seq/frame_001.png" crossorigin="anonymous" />

      <!-- t3-seq (3 frames) -->
      <img id="t3_f0" src="./assets/t3-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t3_f1" src="./assets/t3-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t3_f2" src="./assets/t3-seq/frame_002.png" crossorigin="anonymous" />

      <!-- t4-seq (10 frames) -->
      <img id="t4_f0" src="./assets/t4-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t4_f1" src="./assets/t4-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t4_f2" src="./assets/t4-seq/frame_002.png" crossorigin="anonymous" />
      <img id="t4_f3" src="./assets/t4-seq/frame_003.png" crossorigin="anonymous" />
      <img id="t4_f4" src="./assets/t4-seq/frame_004.png" crossorigin="anonymous" />
      <img id="t4_f5" src="./assets/t4-seq/frame_005.png" crossorigin="anonymous" />
      <img id="t4_f6" src="./assets/t4-seq/frame_006.png" crossorigin="anonymous" />
      <img id="t4_f7" src="./assets/t4-seq/frame_007.png" crossorigin="anonymous" />
      <img id="t4_f8" src="./assets/t4-seq/frame_008.png" crossorigin="anonymous" />
      <img id="t4_f9" src="./assets/t4-seq/frame_009.png" crossorigin="anonymous" />

      <!-- t5-seq (2 frames) -->
      <img id="t5_f0" src="./assets/t5-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t5_f1" src="./assets/t5-seq/frame_001.png" crossorigin="anonymous" />

      <!-- t6-seq (2 frames) -->
      <img id="t6_f0" src="./assets/t6-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t6_f1" src="./assets/t6-seq/frame_001.png" crossorigin="anonymous" />

      <!-- t0-seq (3 frames) -->
      <img id="t0_f0" src="./assets/t0-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t0_f1" src="./assets/t0-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t0_f2" src="./assets/t0-seq/frame_002.png" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- =======================
         TARGET 0 (7 seq layers)
         ======================= -->
    <a-entity id="t0" mindar-image-target="targetIndex: 0">

      <a-image id="seqPlane0_a" src="#t1_f0" position="0 0 0.094" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>

      <a-image id="seqPlane0_b" src="#t2_f0" position="0 0 0.2" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>

      <a-image id="seqPlane0_e" src="#t5_f0" position="0 0 0.4" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>

      <a-image id="seqPlane0_c" src="#t3_f0" position="0 0 0.5" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>

      <a-image id="seqPlane0_g" src="#t6_f0" position="0 0 0.6" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>

      <a-image id="seqPlane0_f" src="#t0_f0" position="0 0 0.7" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>

      <a-image id="seqPlane0_d" src="#t4_f0" position="0 0 0.9" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01; depthWrite:false" visible="false"></a-image>
    </a-entity>

    <!-- =======================
         TARGETS 1..10 (thumb + video)
         ======================= -->
    <a-entity id="t1" mindar-image-target="targetIndex: 1">
      <a-image id="thumbPlane1" src="#thumb1" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane1" src="#vid1" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t2" mindar-image-target="targetIndex: 2">
      <a-image id="thumbPlane2" src="#thumb2" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane2" src="#vid2" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t3" mindar-image-target="targetIndex: 3">
      <a-image id="thumbPlane3" src="#thumb3" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane3" src="#vid3" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t4" mindar-image-target="targetIndex: 4">
      <a-image id="thumbPlane4" src="#thumb4" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane4" src="#vid4" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t5" mindar-image-target="targetIndex: 5">
      <a-image id="thumbPlane5" src="#thumb5" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane5" src="#vid5" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t6" mindar-image-target="targetIndex: 6">
      <a-image id="thumbPlane6" src="#thumb6" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane6" src="#vid6" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t7" mindar-image-target="targetIndex: 7">
      <a-image id="thumbPlane7" src="#thumb7" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane7" src="#vid7" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t8" mindar-image-target="targetIndex: 8">
      <a-image id="thumbPlane8" src="#thumb8" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane8" src="#vid8" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t9" mindar-image-target="targetIndex: 9">
      <a-image id="thumbPlane9" src="#thumb9" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane9" src="#vid9" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t10" mindar-image-target="targetIndex: 10">
      <a-image id="thumbPlane10" src="#thumb10" position="0 0 0.09" width="1" height="2"
        material="shader:flat; transparent:true; alphaTest:0.01"></a-image>
      <a-video id="videoPlane10" src="#vid10" position="0 0 0.1" width="1" height="2"
        material="shader:flat" visible="false"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const btn = document.getElementById('startBtn');

    // ===== Loading UI refs =====
    const loadingOverlay = document.getElementById('loadingOverlay');
    const bar = document.getElementById('bar');
    const pct = document.getElementById('pct');

    const videos  = Array.from({ length: 11 }, (_, i) => document.getElementById(`vid${i}`));
    const targets = Array.from({ length: 11 }, (_, i) => document.getElementById(`t${i}`));

    const thumbPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`thumbPlane${i}`));
    const videoPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`videoPlane${i}`));

    // Target 0 sequence planes
    const seqA = document.getElementById('seqPlane0_a'); // t1
    const seqB = document.getElementById('seqPlane0_b'); // t2
    const seqC = document.getElementById('seqPlane0_c'); // t3
    const seqD = document.getElementById('seqPlane0_d'); // t4 (10 frames)
    const seqE = document.getElementById('seqPlane0_e'); // t5
    const seqF = document.getElementById('seqPlane0_f'); // t0
    const seqG = document.getElementById('seqPlane0_g'); // t6

    // Frames
    const t1Frames = ['#t1_f0', '#t1_f1'];               // 2
    const t2Frames = ['#t2_f0', '#t2_f1'];               // 2
    const t3Frames = ['#t3_f0', '#t3_f1', '#t3_f2'];     // 3
    const t4Frames = [                                  // 10
      '#t4_f0', '#t4_f1', '#t4_f2', '#t4_f3', '#t4_f4',
      '#t4_f5', '#t4_f6', '#t4_f7', '#t4_f8', '#t4_f9'
    ];
    const t5Frames = ['#t5_f0', '#t5_f1'];               // 2
    const t6Frames = ['#t6_f0', '#t6_f1'];               // 2
    const t0Frames = ['#t0_f0', '#t0_f1', '#t0_f2'];     // 3

    let t0Idx = 0;
    let t0Timer = null;
    const T0_FPS = 2;

    function startT0Seq() {
      if (t0Timer) return;

      [seqA, seqB, seqC, seqD, seqE, seqF, seqG].forEach(p => p && p.setAttribute('visible', true));

      t0Timer = setInterval(() => {
        t0Idx++;

        seqA?.setAttribute('src', t1Frames[t0Idx % t1Frames.length]);
        seqB?.setAttribute('src', t2Frames[t0Idx % t2Frames.length]);
        seqC?.setAttribute('src', t3Frames[t0Idx % t3Frames.length]);
        seqD?.setAttribute('src', t4Frames[t0Idx % t4Frames.length]);
        seqE?.setAttribute('src', t5Frames[t0Idx % t5Frames.length]);
        seqG?.setAttribute('src', t6Frames[t0Idx % t6Frames.length]);
        seqF?.setAttribute('src', t0Frames[t0Idx % t0Frames.length]);

      }, 1000 / T0_FPS);
    }

    function stopT0Seq() {
      if (t0Timer) clearInterval(t0Timer);
      t0Timer = null;
      t0Idx = 0;

      seqA?.setAttribute('src', t1Frames[0]);
      seqB?.setAttribute('src', t2Frames[0]);
      seqC?.setAttribute('src', t3Frames[0]);
      seqD?.setAttribute('src', t4Frames[0]);
      seqE?.setAttribute('src', t5Frames[0]);
      seqG?.setAttribute('src', t6Frames[0]);
      seqF?.setAttribute('src', t0Frames[0]);

      [seqA, seqB, seqC, seqD, seqE, seqF, seqG].forEach(p => p && p.setAttribute('visible', false));
    }

    function setVisible(el, visible) {
      if (!el) return;
      el.setAttribute('visible', visible);
    }

    // ✅ FIXED: target 0 is SEQUENCE ONLY (never video)
    function showThumb(i) {
      if (i === 0) {
        startT0Seq();
        return;
      }
      setVisible(thumbPlanes[i], true);
      setVisible(videoPlanes[i], false);
    }

    function showVideo(i) {
      if (i === 0) {
        startT0Seq();
        return;
      }
      setVisible(thumbPlanes[i], false);
      setVisible(videoPlanes[i], true);
    }

    // init: show thumbs; keep target0 seq hidden until targetFound
    for (let i = 0; i < 11; i++) showThumb(i);
    stopT0Seq();

    // ===== iOS unlock (✅ SOUND ENABLED) =====
    let unlocked = false;

    async function unlockVideos() {
      if (unlocked) return;
      unlocked = true;

      // Prime audio under user gesture
      for (const v of videos) {
        if (!v) continue;
        try {
          v.muted = false;
          v.volume = 1;

          await v.play();
          v.pause();
          v.currentTime = 0;
        } catch (e) {}
      }

      btn.style.animation = 'none';
      btn.style.opacity = '0';
      btn.style.pointerEvents = 'none';
      setTimeout(() => {
        if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
      }, 220);
    }

    btn.addEventListener('click', unlockVideos, { once: true });

    // ✅ FIXED: target 0 has NO video autoplay / swap logic
    targets.forEach((targetEl, i) => {
      if (!targetEl) return;
      const v = videos[i];

      // Target 0: sequence only
      if (i === 0) {
        targetEl.addEventListener('targetFound', () => {
          if (!unlocked) return;
          startT0Seq();
        });

        targetEl.addEventListener('targetLost', () => {
          stopT0Seq();
        });

        return; // IMPORTANT: skip video listeners for target 0
      }

      // Targets 1..10: normal thumb <-> video behavior
      if (v) {
        v.addEventListener('playing', () => showVideo(i));
        v.addEventListener('pause',   () => showThumb(i));
        v.addEventListener('ended',   () => showThumb(i));
      }

      targetEl.addEventListener('targetFound', () => {
        if (!unlocked) return;

        showThumb(i);

        try {
          if (!v) return;
          v.currentTime = 0;
          v.muted = false;
          v.volume = 1;
          v.play().catch(() => {});
        } catch (e) {}
      });

      targetEl.addEventListener('targetLost', () => {
        try {
          if (!v) return;
          v.pause();
          v.currentTime = 0;
        } catch (e) {}
        showThumb(i);
      });
    });

    // ===== ✅ Loading bar logic =====
    function setProgress(done, total) {
      const p = total ? Math.round((done / total) * 100) : 0;
      bar.style.width = `${p}%`;
      pct.textContent = `${p}%`;
    }

    function waitAsset(el) {
      return new Promise((resolve) => {
        if (!el) return resolve();

        const tag = el.tagName.toLowerCase();

        // Images
        if (tag === 'img') {
          if (el.complete && el.naturalWidth > 0) return resolve();
          const onDone = () => { cleanup(); resolve(); };
          const onErr  = () => { cleanup(); resolve(); }; // don't block forever
          const cleanup = () => {
            el.removeEventListener('load', onDone);
            el.removeEventListener('error', onErr);
          };
          el.addEventListener('load', onDone, { once: true });
          el.addEventListener('error', onErr, { once: true });
          return;
        }

        // Videos
        if (tag === 'video') {
          // If metadata already loaded, good enough for "ready"
          if (el.readyState >= 1) return resolve(); // HAVE_METADATA
          const onDone = () => { cleanup(); resolve(); };
          const onErr  = () => { cleanup(); resolve(); };
          const cleanup = () => {
            el.removeEventListener('loadedmetadata', onDone);
            el.removeEventListener('error', onErr);
          };
          el.addEventListener('loadedmetadata', onDone, { once: true });
          el.addEventListener('error', onErr, { once: true });
          // Kick preload in some mobile browsers
          try { el.load(); } catch(e) {}
          return;
        }

        // Fallback
        resolve();
      });
    }

    async function runLoading() {
      // Collect all assets inside <a-assets>
      const assetsRoot = document.querySelector('a-assets');
      const allAssets = assetsRoot ? Array.from(assetsRoot.querySelectorAll('img, video')) : [];

      let done = 0;
      const total = allAssets.length || 1;
      setProgress(done, total);

      // Wait each asset; update bar
      for (const a of allAssets) {
        await waitAsset(a);
        done++;
        setProgress(done, total);
      }

      // Small delay so 100% feels stable
      setTimeout(() => {
        if (loadingOverlay) loadingOverlay.style.display = 'none';
        btn.style.display = 'block'; // ✅ show Tap to Start only after loaded
      }, 150);
    }

    // Start loading after DOM is ready
    window.addEventListener('load', runLoading, { once: true });
  </script>

</body>
</html>
