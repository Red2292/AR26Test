<!doctype html>

  <style>
    #startBtn{
      position:fixed; z-index:9999;
      left:50%; bottom:24px; transform:translateX(-50%);
      padding:16px 26px; border-radius:14px; border:none;
      font-size:16px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
      color:#fff; background:linear-gradient(135deg,#ff7a18,#ff3d81);
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      cursor:pointer;
      -webkit-tap-highlight-color:transparent;
      transition:opacity 200ms ease, transform 120ms ease;
      animation:pulse 1.8s infinite;
    }
    @keyframes pulse{
      0%{transform:translateX(-50%) scale(1);}
      50%{transform:translateX(-50%) scale(1.06);}
      100%{transform:translateX(-50%) scale(1);}
    }
    #startBtn:active{transform:translateX(-50%) scale(.97);}
    #startBtn[disabled]{opacity:.55; pointer-events:none; animation:none;}
  </style>
</head>

    background:rgba(0,0,0,.72); color:#fff; font-family:system-ui;

  <script>
    const btn = document.getElementById('startBtn');

    /* =======================
       OPTION A LOADER (REAL-ISH)
       - videos: byte-progress (needs Content-Length)
       - images: count-progress
       ======================= */
    const loader = document.getElementById('loader');
    const loaderBar = document.getElementById('loaderBar');
    const loaderText = document.getElementById('loaderText');

    function setProgress(pct) {
      const p = Math.max(0, Math.min(100, pct));
      if (loaderBar) loaderBar.style.width = p.toFixed(0) + '%';
      if (loaderText) loaderText.textContent = p.toFixed(0) + '%';
    }

    function hideLoader() {
      if (!loader) return;
      loader.style.transition = "opacity 250ms ease";
      loader.style.opacity = "0";
      setTimeout(() => {
        if (loader && loader.parentNode) loader.parentNode.removeChild(loader);
      }, 260);
    }

    function enableStart() {
      btn.disabled = false;
      btn.style.opacity = '1';
      btn.style.pointerEvents = 'auto';
      btn.textContent = "Tap to Start";
    }

    function preloadImagesByCount(urls, onProgress) {
      let loaded = 0;
      const total = urls.length || 1;

      return new Promise((resolve) => {
        if (!urls.length) return resolve();

        urls.forEach((url) => {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = img.onerror = () => {
            loaded++;
            onProgress(loaded / total);
            if (loaded >= total) resolve();
          };
          img.src = url;
        });
      });
    }

    async function fetchWithProgress(url, onProgress) {
      const res = await fetch(url, { cache: "force-cache" });
      if (!res.ok) throw new Error(`Failed: ${url}`);

      const len = Number(res.headers.get('content-length')) || 0;
      if (!res.body || !len) {
        await res.blob(); // can't compute byte % without length
        onProgress(1);
        return;
      }

      const reader = res.body.getReader();
      let received = 0;

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        received += value.byteLength;
        onProgress(received / len);
      }
    }

    function collectAssetUrls() {
      const assets = document.querySelector('a-assets');
      if (!assets) return { imageUrls: [], videoUrls: [], mindUrls: [] };

      const imageUrls = [];
      const videoUrls = [];
      const mindUrls  = ["./targets.mind"]; // preload mind file (best effort)

      assets.querySelectorAll('img[src]').forEach(el => {
        const src = el.getAttribute('src');
        if (src && !src.startsWith('#')) imageUrls.push(src);
      });

      assets.querySelectorAll('video[src]').forEach(el => {
        const src = el.getAttribute('src');
        if (src && !src.startsWith('#')) videoUrls.push(src);
      });

      const uniq = (arr) => Array.from(new Set(arr));
      return {
        imageUrls: uniq(imageUrls),
        videoUrls: uniq(videoUrls),
        mindUrls:  uniq(mindUrls)
      };
    }

    async function preloadARAssets() {
      setProgress(0);

      const { imageUrls, videoUrls, mindUrls } = collectAssetUrls();

      let mindPct = 0;
      let videoPct = 0;
      let imgPct = 0;

      const updateCombined = () => {
        // weights: mind 5%, videos 70%, images 25%
        const combined = (mindPct * 0.05) + (videoPct * 0.70) + (imgPct * 0.25);
        setProgress(combined * 100);
      };

      // 0) targets.mind (best effort)
      for (let i = 0; i < mindUrls.length; i++) {
        await fetchWithProgress(mindUrls[i], (p) => {
          const per = 1 / mindUrls
