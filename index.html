<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed; z-index:9999;
      left:50%; bottom:24px; transform:translateX(-50%);
      padding:16px 26px; border-radius:14px; border:none;
      font-size:16px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
      color:#fff; background:linear-gradient(135deg,#ff7a18,#ff3d81);
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      cursor:pointer; animation:pulse 1.8s infinite;
    }
    @keyframes pulse{
      0%{transform:translateX(-50%) scale(1);}
      50%{transform:translateX(-50%) scale(1.06);}
      100%{transform:translateX(-50%) scale(1);}
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">
<button id="startBtn">Tap to Start</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true"
>
  <a-assets>
    <!-- thumbs -->
    <img id="thumb0" src="./assets/Son-Thumb.png" />
    <img id="thumb1" src="./assets/Bao-Thumb.png" />
    <img id="thumb2" src="./assets/Dien-Thumbs.png" />
    <img id="thumb3" src="./assets/Dung-thumb.png" />
    <img id="thumb4" src="./assets/Duy-Thumb.png" />
    <img id="thumb5" src="./assets/Kiet-Thumb.png" />
    <img id="thumb6" src="./assets/Minh-Thumb.png" />
    <img id="thumb7" src="./assets/Phong-Thumb.png" />
    <img id="thumb8" src="./assets/Tin-Thumb.png" />
    <img id="thumb9" src="./assets/Van-Thumb.png" />
    <img id="thumb10" src="./assets/Xo-Thumb.png" />

    <!-- videos -->
    <video id="vid0" src="./assets/phoma01.mp4" loop muted playsinline></video>
    <video id="vid1" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid2" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid3" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid4" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid5" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid6" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid7" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid8" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid9" src="./assets/target.mp4" loop muted playsinline></video>
    <video id="vid10" src="./assets/target.mp4" loop muted playsinline></video>

    <!-- sequence used for TARGET 0 -->
    <img id="t0_f0" src="./assets/t1-seq/frame_000.png" />
    <img id="t0_f1" src="./assets/t1-seq/frame_001.png" />
    <!-- t2 sequence for TARGET 0 -->
<img id="t2_f0" src="./assets/t2-seq/frame_000.png" crossorigin="anonymous" />
<img id="t2_f1" src="./assets/t2-seq/frame_001.png" crossorigin="anonymous" />


    
  </a-assets>

  <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

  <!-- TARGET 0 -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0">
    <a-image id="thumbPlane0" src="#thumb0" position="0 0 0.01" width="1" height="2"
      material="shader:flat; transparent:true"></a-image>
    
<!-- t1-seq layer -->
    <a-image id="seqPlane0" src="#t0_f0" position="0 0 0.05" width="1" height="2"
      material="shader:flat; transparent:true; depthWrite:false"
      visible="false"></a-image>
<!-- t2-seq layer -->
<a-image id="seqPlane0_b"
  src="#t2_f0"
  position="0 0 0.010"
  width="1"
  height="2"
  material="shader: flat; transparent: true; depthWrite: false"
  visible="false">
</a-image>

    

    <a-video id="videoPlane0" src="#vid0" position="0 0 0.1" width="1" height="2"
      material="shader:flat" visible="false"></a-video>
  </a-entity>

<script>
  const btn = document.getElementById('startBtn');

  const videos  = Array.from({ length: 11 }, (_, i) => document.getElementById(`vid${i}`));
  const targets = Array.from({ length: 11 }, (_, i) => document.getElementById(`t${i}`));

  const thumbPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`thumbPlane${i}`));
  const videoPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`videoPlane${i}`));

  // ===== TARGET 0: TWO PNG SEQUENCE LAYERS =====
  // Layer A uses t1-seq (2 frames) that you mapped as: #t0_f0, #t0_f1
  // Layer B uses t2-seq (2 frames): #t2_f0, #t2_f1
  const seqPlane0a = document.getElementById('seqPlane0');     // <a-image id="seqPlane0" ...>
  const seqPlane0b = document.getElementById('seqPlane0_b');   // <a-image id="seqPlane0_b" ...>

  const t1Frames = ['#t0_f0', '#t0_f1'];   // t1-seq frames
  const t2Frames = ['#t2_f0', '#t2_f1'];   // t2-seq frames

  let t0Idx = 0;
  let t0Timer = null;
  const T0_FPS = 2;

  function startT0Seq() {
    if (t0Timer) return;

    if (seqPlane0a) seqPlane0a.setAttribute('visible', true);
    if (seqPlane0b) seqPlane0b.setAttribute('visible', true);

    t0Timer = setInterval(() => {
      t0Idx++;

      if (seqPlane0a) {
        seqPlane0a.setAttribute('src', t1Frames[t0Idx % t1Frames.length]);
      }
      if (seqPlane0b) {
        seqPlane0b.setAttribute('src', t2Frames[t0Idx % t2Frames.length]);
      }
    }, 1000 / T0_FPS);
  }

  function stopT0Seq() {
    if (t0Timer) clearInterval(t0Timer);
    t0Timer = null;
    t0Idx = 0;

    if (seqPlane0a) {
      seqPlane0a.setAttribute('src', t1Frames[0]);
      seqPlane0a.setAttribute('visible', false);
    }
    if (seqPlane0b) {
      seqPlane0b.setAttribute('src', t2Frames[0]);
      seqPlane0b.setAttribute('visible', false);
    }
  }

  // ===== VISIBILITY HELPERS =====
  function setVisible(el, v) {
    if (!el) return;
    el.setAttribute('visible', v);
  }

  function showThumb(i) {
    setVisible(thumbPlanes[i], true);
    setVisible(videoPlanes[i], false);

    // Only target 0 runs sequences
    if (i === 0) startT0Seq();
    else stopT0Seq();
  }

  function showVideo(i) {
    setVisible(thumbPlanes[i], false);
    setVisible(videoPlanes[i], true);

    // Stop target 0 sequences when video plays
    if (i === 0) stopT0Seq();
  }

  // ===== INIT =====
  for (let i = 0; i < 11; i++) {
    showThumb(i); // thumbs on, videos off
  }
  stopT0Seq(); // keep seq hidden until target 0 is found

  // ===== iOS VIDEO UNLOCK =====
  let unlocked = false;

  async function unlockVideos() {
    if (unlocked) return;
    unlocked = true;

    for (const v of videos) {
      if (!v) continue;
      try {
        await v.play();
        v.pause();
        v.currentTime = 0;
      } catch (e) {}
    }

    btn.style.animation = 'none';
    btn.style.opacity = '0';
    btn.style.pointerEvents = 'none';
    setTimeout(() => {
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
    }, 220);
  }

  btn.addEventListener('click', unlockVideos, { once: true });

  // ===== TARGET EVENTS =====
  targets.forEach((targetEl, i) => {
    if (!targetEl) return;
    const v = videos[i];

    if (v) {
      v.addEventListener('playing', () => showVideo(i));
      v.addEventListener('pause',   () => showThumb(i));
      v.addEventListener('ended',   () => showThumb(i));
    }

    targetEl.addEventListener('targetFound', async () => {
      if (!unlocked) return;

      // Show thumb state immediately (for target 0 this starts sequences)
      showThumb(i);

      // Then play video (if any)
      try {
        if (!v) return;
        v.currentTime = 0;
        const p = v.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) {}
    });

    targetEl.addEventListener('targetLost', () => {
      try {
        if (!v) return;
        v.pause();
        v.currentTime = 0;
      } catch (e) {}

      // Back to thumb (target 0 sequences start again if desired)
      showThumb(i);
    });
  });
</script>

</body>
</html>
