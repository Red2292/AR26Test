<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body style="margin:0; overflow:hidden;">
  <button id="startBtn"
    style="position:fixed;z-index:999;top:16px;left:16px;padding:10px 14px;border-radius:10px;">
    Tap to Start
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true, physicallyCorrectLights"
    color-space="sRGB"
  >
    <a-assets>
      <!-- 11 videos (target 0 -> 10). Replace src paths as needed -->
      <video id="vid0"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid1"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid2"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid3"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid4"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid5"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid6"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid7"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid8"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid9"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid10" src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- 11 targets -->
    <a-entity id="t0"  mindar-image-target="targetIndex: 0">
      <a-video src="#vid0" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t1"  mindar-image-target="targetIndex: 1">
      <a-video src="#vid1" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t2"  mindar-image-target="targetIndex: 2">
      <a-video src="#vid2" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t3"  mindar-image-target="targetIndex: 3">
      <a-video src="#vid3" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t4"  mindar-image-target="targetIndex: 4">
      <a-video src="#vid4" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t5"  mindar-image-target="targetIndex: 5">
      <a-video src="#vid5" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t6"  mindar-image-target="targetIndex: 6">
      <a-video src="#vid6" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t7"  mindar-image-target="targetIndex: 7">
      <a-video src="#vid7" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t8"  mindar-image-target="targetIndex: 8">
      <a-video src="#vid8" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t9"  mindar-image-target="targetIndex: 9">
      <a-video src="#vid9" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

    <a-entity id="t10" mindar-image-target="targetIndex: 10">
      <a-video src="#vid10" position="0 0 0.1" width="1" height="0.56"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const btn = document.getElementById('startBtn');

    // Grab all 11 video elements
    const videos = Array.from({ length: 11 }, (_, i) => document.getElementById(`vid${i}`));

    // Grab all 11 target entities
    const targets = Array.from({ length: 11 }, (_, i) => document.getElementById(`t${i}`));

    let unlocked = false;

    // 1) User gesture to unlock video playback (iOS)
    btn.addEventListener('click', async () => {
      unlocked = true;

      // Try play+pause quickly to "unlock" all videos
      for (const v of videos) {
        try {
          await v.play();
          v.pause();
          v.currentTime = 0;
        } catch (e) {
          // ignore (some devices still block until targetFound)
        }
      }

      btn.style.display = 'none';
    });

    // 2) Play video only when its target is found
    targets.forEach((targetEl, i) => {
      const v = videos[i];

      targetEl.addEventListener('targetFound', async () => {
        if (!unlocked) return;
        try {
          // restart or continue — choose one:
          // v.currentTime = 0; // uncomment to restart every time
          await v.play();
        } catch (e) {}
      });

      targetEl.addEventListener('targetLost', () => {
        try { v.pause(); } catch (e) {}
      });
    });
  </script>
</body>
</html>
