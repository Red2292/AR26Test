<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <title>MindAR iOS Safe</title>
</head>

<body style="margin:0; overflow:hidden;">
  <!-- iOS unlock + start camera button (CENTERED) -->
  <button id="startBtn"
    style="
      position:fixed;
      z-index:999;
      top:50%;
      left:50%;
      transform:translate(-50%, -50%);
      padding:16px 24px;
      border-radius:14px;
      font-size:16px;
      background:#000;
      color:#fff;
      border:none;
      box-shadow:0 8px 24px rgba(0,0,0,.35);
    ">
    Tap to Start
  </button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="colorManagement: true, physicallyCorrectLights"
    color-space="sRGB"
  >
    <a-assets>
      <!-- 11 videos (target 0 -> 10) -->
      <!-- NOTE: removed crossorigin to avoid iOS CORS issues on tunnels -->
      <video id="vid0"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid1"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid2"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid3"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid4"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid5"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid6"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid7"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid8"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid9"  src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
      <video id="vid10" src="./assets/target.mp4" preload="auto" loop muted playsinline webkit-playsinline></video>
		
		<img id="img2" src="./assets/Bao-Target.png" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- TARGET 0 with 6 PNG sequence layers -->
    <a-entity id="t0" mindar-image-target="targetIndex: 0">
      <a-video src="#vid0" position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video>

      <a-plane id="seqL1" position="0 0 0.12" width="0.56" height="1" material="transparent:true; shader:flat"></a-plane>
      <a-plane id="seqL2" position="0 0 0.13" width="0.56" height="1" material="transparent:true; shader:flat"></a-plane>
      <a-plane id="seqL3" position="0 0 0.14" width="0.56" height="1" material="transparent:true; shader:flat"></a-plane>
      <a-plane id="seqL4" position="0 0 0.15" width="0.56" height="1" material="transparent:true; shader:flat"></a-plane>
      <a-plane id="seqL5" position="0 0 0.16" width="0.56" height="1" material="transparent:true; shader:flat"></a-plane>
      <a-plane id="seqL6" position="0 0 0.17" width="0.56" height="1" material="transparent:true; shader:flat"></a-plane>
    </a-entity>

    <!-- Remaining targets -->
    <a-entity id="t2" mindar-image-target="targetIndex: 2">
  <a-plane
    src="#img2"
    position="0 0 0.1"
    width="0.56"
    height="1"
    material="shader: flat; transparent: true">
  </a-plane>
</a-entity>
	  
   <a-entity id="t3"  mindar-image-target="targetIndex: 3"><a-video src="#vid3"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t4"  mindar-image-target="targetIndex: 4"><a-video src="#vid4"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t5"  mindar-image-target="targetIndex: 5"><a-video src="#vid5"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t6"  mindar-image-target="targetIndex: 6"><a-video src="#vid6"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t7"  mindar-image-target="targetIndex: 7"><a-video src="#vid7"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t8"  mindar-image-target="targetIndex: 8"><a-video src="#vid8"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t9"  mindar-image-target="targetIndex: 9"><a-video src="#vid9"  position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
    <a-entity id="t10" mindar-image-target="targetIndex: 10"><a-video src="#vid10" position="0 0 0.1" width="0.56" height="1" material="shader: flat"></a-video></a-entity>
  </a-scene>

<script>
  const btn = document.getElementById('startBtn');

  const sceneEl = document.querySelector('a-scene');
  const arSystem = sceneEl.systems['mindar-image-system'];

  const videos = Array.from({ length: 11 }, (_, i) =>
    document.getElementById(`vid${i}`)
  );
  const targets = Array.from({ length: 11 }, (_, i) =>
    document.getElementById(`t${i}`)
  );

  let unlocked = false;
  let arStarted = false;

  async function startARAndUnlock() {
    if (unlocked) return;

    // 1️⃣ Try start AR camera
    if (!arStarted) {
      try {
        await arSystem.start();
        arStarted = true;
      } catch (e) {
        // ❌ DO NOTHING (no alert)
        // iOS Safari may throw on first attempt even when camera is allowed
        console.warn('MindAR start() retry needed', e);
        return;
      }
    }

    unlocked = true;

    // 2️⃣ Unlock videos (iOS autoplay policy)
    for (const v of videos) {
      if (!v) continue;
      try {
        await v.play();
        v.pause();
        v.currentTime = 0;
      } catch (e) {}
    }

    btn.style.display = 'none';
  }

  btn.addEventListener('click', startARAndUnlock);

  targets.forEach((targetEl, i) => {
    const v = videos[i];
    if (!v) return;

    targetEl.addEventListener('targetFound', async () => {
      if (!unlocked) return;
      try {
        v.currentTime = 0;
        await v.play();
      } catch (e) {}
    });

    targetEl.addEventListener('targetLost', () => {
      try { v.pause(); } catch (e) {}
    });
  });

  window.addEventListener('pagehide', () => {
    try { arSystem.stop(); } catch (e) {}
  });
</script>

</body>
</html>
