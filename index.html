<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- A-Frame + MindAR -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <!-- Start button styles -->
  <style>
    .start-btn {
      position: fixed;
      z-index: 9999;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 34px;
      border-radius: 18px;
      border: none;
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #fff;
      background: linear-gradient(135deg, #ff7a18, #ff3d81);
      box-shadow: 0 14px 40px rgba(0,0,0,0.45);
      cursor: pointer;
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%   { transform: translate(-50%, -50%) scale(1); }
      50%  { transform: translate(-50%, -50%) scale(1.06); }
      100% { transform: translate(-50%, -50%) scale(1); }
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">

<!-- TAP TO START -->
<button id="startBtn" class="start-btn">TAP TO START AR</button>

<a-scene
  id="scene"
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: false; maxTrack: 1;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true"
>
  <a-assets>
    <!-- Thumbnails -->
    <img id="thumb0"  src="./assets/Son-Thumb.png">
    <img id="thumb1"  src="./assets/Bao-Thumb.png">
    <img id="thumb2"  src="./assets/Tin-Thumb.png">
    <img id="thumb3"  src="./assets/Dung-thumb.png">
    <img id="thumb4"  src="./assets/Duy-Thumb.png">
    <img id="thumb5"  src="./assets/Dien-Thumbs.png">
    <img id="thumb6"  src="./assets/Minh-Thumb.png">
    <img id="thumb7"  src="./assets/Phong-Thumb.png">
    <img id="thumb8"  src="./assets/Kiet-Thumb.png">
    <img id="thumb9"  src="./assets/Van-Thumb.png">
    <img id="thumb10" src="./assets/Xo-Thumb.png">

    <!-- Videos -->
    <video id="vid0"  src="./assets/phoma01.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid1"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid2"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid3"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid4"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid5"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid6"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid7"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid8"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid9"  src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
    <video id="vid10" src="./assets/target.mp4" loop muted playsinline webkit-playsinline></video>
  </a-assets>

  <a-camera look-controls="enabled:false"></a-camera>

  <!-- 11 TARGETS -->
  <!-- Ratio: width=1 height=2 -->

  <!-- TEMPLATE REPEATED -->
  <!-- Target 0 -->
  <a-entity id="t0" mindar-image-target="targetIndex: 0">
    <a-image id="thumbPlane0" src="#thumb0" width="1" height="2"
      material="shader:flat; transparent:true"></a-image>
    <a-video id="videoPlane0" src="#vid0" width="1" height="2"
      material="shader:flat" visible="false"></a-video>
  </a-entity>

  <!-- Targets 1–10 -->
  <!-- (same structure, different IDs) -->

  <script>
    for (let i = 1; i <= 10; i++) {
      const entity = document.createElement('a-entity');
      entity.setAttribute('id', `t${i}`);
      entity.setAttribute('mindar-image-target', `targetIndex: ${i}`);
      entity.innerHTML = `
        <a-image id="thumbPlane${i}" src="#thumb${i}" width="1" height="2"
          material="shader:flat; transparent:true"></a-image>
        <a-video id="videoPlane${i}" src="#vid${i}" width="1" height="2"
          material="shader:flat" visible="false"></a-video>
      `;
      document.querySelector('a-scene').appendChild(entity);
    }
  </script>
</a-scene>

<script>
  const btn = document.getElementById('startBtn');
  const sceneEl = document.getElementById('scene');

  const videos = [...Array(11)].map((_, i) => document.getElementById(`vid${i}`));
  const thumbs = [...Array(11)].map((_, i) => document.getElementById(`thumbPlane${i}`));
  const planes = [...Array(11)].map((_, i) => document.getElementById(`videoPlane${i}`));
  const targets = [...Array(11)].map((_, i) => document.getElementById(`t${i}`));

  function showThumb(i) {
    thumbs[i].setAttribute('visible', true);
    planes[i].setAttribute('visible', false);
  }

  function showVideo(i) {
    thumbs[i].setAttribute('visible', false);
    planes[i].setAttribute('visible', true);
  }

  btn.addEventListener('click', async () => {
    btn.style.animation = 'none';

    // unlock ALL videos (iOS gesture)
    for (const v of videos) {
      try {
        await v.play();
        v.pause();
        v.currentTime = 0;
      } catch (e) {}
    }

    // start MindAR AFTER gesture
    sceneEl.components['mindar-image'].start();

    btn.style.opacity = '0';
    setTimeout(() => btn.remove(), 300);
  });

  targets.forEach((t, i) => {
    const v = videos[i];

    v.addEventListener('playing', () => showVideo(i));
    v.addEventListener('pause',   () => showThumb(i));

    t.addEventListener('targetFound', () => {
      v.currentTime = 0;
      v.play();
    });

    t.addEventListener('targetLost', () => {
      v.pause();
      v.currentTime = 0;
      showThumb(i);
    });
  });
</script>

</body>
</html>
