<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn{
      position:fixed; z-index:9999;
      left:50%; bottom:24px; transform:translateX(-50%);
      padding:16px 26px; border-radius:14px; border:none;
      font-size:16px; font-weight:800; letter-spacing:.4px; text-transform:uppercase;
      color:#fff; background:linear-gradient(135deg,#ff7a18,#ff3d81);
      box-shadow:0 10px 28px rgba(0,0,0,.35);
      cursor:pointer; animation:pulse 1.8s infinite;
      -webkit-tap-highlight-color:transparent;
    }
    @keyframes pulse{
      0%{transform:translateX(-50%) scale(1);}
      50%{transform:translateX(-50%) scale(1.06);}
      100%{transform:translateX(-50%) scale(1);}
    }
    #startBtn[disabled]{opacity:.55; pointer-events:none; animation:none;}
  </style>
</head>

<body style="margin:0; overflow:hidden;">

<!-- ================= LOADER (OPTION A) ================= -->
<div id="loader" style="
  position:fixed; inset:0; z-index:10000;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,.72); color:#fff; font-family:system-ui;">
  <div style="width:min(420px,86vw); text-align:center;">
    <div style="font-weight:800; font-size:16px; margin-bottom:10px;">
      Loading AR package…
    </div>
    <div style="height:10px; background:rgba(255,255,255,.18); border-radius:999px; overflow:hidden;">
      <div id="loaderBar" style="height:100%; width:0%; background:linear-gradient(90deg,#ff7a18,#ff3d81);"></div>
    </div>
    <div id="loaderText" style="margin-top:10px; font-size:13px;">0%</div>
  </div>
</div>

<button id="startBtn" disabled>Loading…</button>

<a-scene
  mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
  vr-mode-ui="enabled:false"
  device-orientation-permission-ui="enabled:false"
  renderer="colorManagement:true"
>
<a-assets>

<!-- thumbs -->
<img id="thumb0" src="./assets/Son-Thumb.png" />
<img id="thumb1" src="./assets/Bao-Thumb.png" />
<img id="thumb2" src="./assets/Dien-Thumbs.png" />
<img id="thumb3" src="./assets/Dung-thumb.png" />
<img id="thumb4" src="./assets/Duy-Thumb.png" />
<img id="thumb5" src="./assets/Kiet-Thumb.png" />
<img id="thumb6" src="./assets/Minh-Thumb.png" />
<img id="thumb7" src="./assets/Phong-Thumb.png" />
<img id="thumb8" src="./assets/Tin-Thumb.png" />
<img id="thumb9" src="./assets/Van-Thumb.png" />
<img id="thumb10" src="./assets/Xo-Thumb.png" />

<!-- videos -->
<video id="vid0" src="./assets/phoma01.mp4" preload="auto" loop muted playsinline></video>
<video id="vid1" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid2" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid3" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid4" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid5" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid6" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid7" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid8" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid9" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>
<video id="vid10" src="./assets/target.mp4" preload="auto" loop muted playsinline></video>

<!-- ===== SEQUENCES ===== -->

<!-- t1 (2) -->
<img id="t1_f0" src="./assets/t1-seq/frame_000.png" />
<img id="t1_f1" src="./assets/t1-seq/frame_001.png" />

<!-- t2 (2) -->
<img id="t2_f0" src="./assets/t2-seq/frame_000.png" />
<img id="t2_f1" src="./assets/t2-seq/frame_001.png" />

<!-- t3 (3) -->
<img id="t3_f0" src="./assets/t3-seq/frame_000.png" />
<img id="t3_f1" src="./assets/t3-seq/frame_001.png" />
<img id="t3_f2" src="./assets/t3-seq/frame_002.png" />

<!-- ✅ t4 (10 FRAMES) -->
<img id="t4_f0" src="./assets/t4-seq/frame_000.png" />
<img id="t4_f1" src="./assets/t4-seq/frame_001.png" />
<img id="t4_f2" src="./assets/t4-seq/frame_002.png" />
<img id="t4_f3" src="./assets/t4-seq/frame_003.png" />
<img id="t4_f4" src="./assets/t4-seq/frame_004.png" />
<img id="t4_f5" src="./assets/t4-seq/frame_005.png" />
<img id="t4_f6" src="./assets/t4-seq/frame_006.png" />
<img id="t4_f7" src="./assets/t4-seq/frame_007.png" />
<img id="t4_f8" src="./assets/t4-seq/frame_008.png" />
<img id="t4_f9" src="./assets/t4-seq/frame_009.png" />

<!-- t5 (2) -->
<img id="t5_f0" src="./assets/t5-seq/frame_000.png" />
<img id="t5_f1" src="./assets/t5-seq/frame_001.png" />

<!-- t6 (2) -->
<img id="t6_f0" src="./assets/t6-seq/frame_000.png" />
<img id="t6_f1" src="./assets/t6-seq/frame_001.png" />

<!-- t0 (3) -->
<img id="t0_f0" src="./assets/t0-seq/frame_000.png" />
<img id="t0_f1" src="./assets/t0-seq/frame_001.png" />
<img id="t0_f2" src="./assets/t0-seq/frame_002.png" />

</a-assets>

<a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

<!-- ================= TARGET 0 ================= -->
<a-entity id="t0" mindar-image-target="targetIndex:0">
  <a-image id="thumbPlane0" src="#thumb0" position="0 0 0.09" width="1" height="2"></a-image>

  <a-image id="seqPlane0_a" src="#t1_f0" position="0 0 0.10" width="1" height="2" visible="false"></a-image>
  <a-image id="seqPlane0_b" src="#t2_f0" position="0 0 0.20" width="1" height="2" visible="false"></a-image>
  <a-image id="seqPlane0_e" src="#t5_f0" position="0 0 0.30" width="1" height="2" visible="false"></a-image>
  <a-image id="seqPlane0_c" src="#t3_f0" position="0 0 0.40" width="1" height="2" visible="false"></a-image>
  <a-image id="seqPlane0_g" src="#t6_f0" position="0 0 0.55" width="1" height="2" visible="false"></a-image>
  <a-image id="seqPlane0_f" src="#t0_f0" position="0 0 0.70" width="1" height="2" visible="false"></a-image>
  <a-image id="seqPlane0_d" src="#t4_f0" position="0 0 1.00" width="1" height="2" visible="false"></a-image>
</a-entity>

</a-scene>

<script>
/* ================= LOADER ================= */
const loader=document.getElementById('loader');
const bar=document.getElementById('loaderBar');
const txt=document.getElementById('loaderText');
const btn=document.getElementById('startBtn');

function setP(p){bar.style.width=p+'%';txt.textContent=p+'%';}
setTimeout(()=>{setP(100);btn.disabled=false;btn.textContent='Tap to Start';loader.remove();},1200);

/* ================= SEQUENCE LOGIC ================= */
const seqA=seqPlane0_a,seqB=seqPlane0_b,seqC=seqPlane0_c,
      seqD=seqPlane0_d,seqE=seqPlane0_e,seqF=seqPlane0_f,seqG=seqPlane0_g;

const t1=['#t1_f0','#t1_f1'];
const t2=['#t2_f0','#t2_f1'];
const t3=['#t3_f0','#t3_f1','#t3_f2'];
const t4=['#t4_f0','#t4_f1','#t4_f2','#t4_f3','#t4_f4','#t4_f5','#t4_f6','#t4_f7','#t4_f8','#t4_f9'];
const t5=['#t5_f0','#t5_f1'];
const t6=['#t6_f0','#t6_f1'];
const t0=['#t0_f0','#t0_f1','#t0_f2'];

let i=0;
setInterval(()=>{
  i++;
  seqA.src=t1[i%t1.length];
  seqB.src=t2[i%t2.length];
  seqC.src=t3[i%t3.length];
  seqD.src=t4[i%t4.length];
  seqE.src=t5[i%t5.length];
  seqG.src=t6[i%t6.length];
  seqF.src=t0[i%t0.length];
},500);
</script>

</body>
</html>
