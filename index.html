<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);

      padding: 16px 26px;
      border-radius: 14px;
      border: none;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;

      color: #fff;
      background: linear-gradient(135deg, #ff7a18, #ff3d81);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);

      cursor: pointer;
      animation: pulse 1.8s infinite;
      -webkit-tap-highlight-color: transparent;

      transition: opacity 200ms ease;
    }

    @keyframes pulse {
      0%   { transform: translateX(-50%) scale(1); }
      50%  { transform: translateX(-50%) scale(1.06); }
      100% { transform: translateX(-50%) scale(1); }
    }

    #startBtn:active {
      transform: translateX(-50%) scale(0.97);
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">

  <button id="startBtn" type="button">Tap to Start</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="colorManagement:true, physicallyCorrectLights"
    color-space="sRGB"
  >
    <a-assets>
      <!-- thumbnails -->
      <img id="thumb0"  src="./assets/Son-Thumb.png" crossorigin="anonymous" />

      <img id="thumb2"  src="./assets/Dien-Thumbs.png" crossorigin="anonymous" />
      <img id="thumb3"  src="./assets/Dung-thumb.png" crossorigin="anonymous" />
      <img id="thumb4"  src="./assets/Duy-Thumb.png" crossorigin="anonymous" />
      <img id="thumb5"  src="./assets/Kiet-Thumb.png" crossorigin="anonymous" />
      <img id="thumb6"  src="./assets/Minh-Thumb.png" crossorigin="anonymous" />
      <img id="thumb7"  src="./assets/Phong-Thumb.png" crossorigin="anonymous" />
      <img id="thumb8"  src="./assets/Tin-Thumb.png" crossorigin="anonymous" />
      <img id="thumb9"  src="./assets/Van-Thumb.png" crossorigin="anonymous" />
      <img id="thumb10" src="./assets/Xo-Thumb.png" crossorigin="anonymous" />

      <!-- videos -->

      <video id="vid1"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid2"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid3"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid4"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid5"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid6"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid7"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid8"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

            <a-image id="frame" src="#frame" position="0 0 0.085" width="1" height="2"

    <!-- Target 3 -->

      <a-image id="t3_seqPlane" src="#t3_f0" position="0 0 0.095" width="1" height="2"

    <!-- Target 4 -->
    <a-entity id="t4" mindar-image-target="targetIndex: 4">

               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane4" src="#vid4" position="0 0 0.1" width="1" height="2"

    <a-entity id="t6" mindar-image-target="targetIndex: 6">

  <script>
<script>
  const btn = document.getElementById('startBtn');

  const targets = Array.from({ length: 11 }, (_, i) => document.getElementById(`t${i}`));
  const videos  = Array.from({ length: 11 }, (_, i) => document.getElementById(`vid${i}`)); // vid0 vẫn có nhưng không dùng cho target 0

  const thumbPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`thumbPlane${i}`));
  const videoPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`videoPlane${i}`)); // videoPlane0 sẽ null => ok

  // ===== Target 0: 6 PNG sequence layers (no video) =====
  const t0FramePlane = document.getElementById('framePlane0'); // optional overlay frame
  const t0Planes = [
    document.getElementById('t0_seqPlane_0'),
    document.getElementById('t0_seqPlane_1'),
    document.getElementById('t0_seqPlane_2'),
    document.getElementById('t0_seqPlane_3'),
    document.getElementById('t0_seqPlane_4'),
    document.getElementById('t0_seqPlane_5'),
  ];

  // IMPORTANT: update these to match assets you actually loaded
  // If you haven't loaded t0_lX_fY yet, temporarily use t0_f0..f2 for all layers (demo)
  const t0LayersFrames = [
    ['#t0_f0', '#t0_f1', '#t0_f2'],
    ['#t0_f0', '#t0_f1', '#t0_f2'],
    ['#t0_f0', '#t0_f1', '#t0_f2'],
    ['#t0_f0', '#t0_f1', '#t0_f2'],
    ['#t0_f0', '#t0_f1', '#t0_f2'],
    ['#t0_f0', '#t0_f1', '#t0_f2'],
  ];

  let t0Index = 0;
  let t0Timer = null;
  const T0_FPS = 6;

  function startT0Layers() {
    if (t0Timer) return;
    if (t0FramePlane) t0FramePlane.setAttribute('visible', true);

    t0Planes.forEach(p => p && p.setAttribute('visible', true));

    t0Timer = setInterval(() => {
      t0Index++;
      for (let l = 0; l < t0Planes.length; l++) {
        const plane = t0Planes[l];
        const frames = t0LayersFrames[l];
        if (!plane || !frames || frames.length === 0) continue;
        const idx = t0Index % frames.length;
        plane.setAttribute('src', frames[idx]);
      }
    }, 1000 / T0_FPS);
  }

  function stopT0Layers() {
    if (t0Timer) clearInterval(t0Timer);
    t0Timer = null;
    t0Index = 0;

    if (t0FramePlane) t0FramePlane.setAttribute('visible', false);

    for (let l = 0; l < t0Planes.length; l++) {
      const plane = t0Planes[l];
      const frames = t0LayersFrames[l];
      if (!plane || !frames || frames.length === 0) continue;
      plane.setAttribute('src', frames[0]);
      plane.setAttribute('visible', false);
    }
  }

  // ===== Targets 1..5 sequences (as you had) =====
  const seqPlanes = {
    1: document.getElementById('t1_seqPlane'),
    2: document.getElementById('t2_seqPlane'),
    3: document.getElementById('t3_seqPlane'),
    4: document.getElementById('t4_seqPlane'),
    5: document.getElementById('t5_seqPlane'),
    // 6: none
  };

  const seqFrames = {
    1: ['#t1_f0', '#t1_f1'],
    2: ['#t2_f0', '#t2_f1'],
    3: ['#t3_f0', '#t3_f1', '#t3_f2'],
    4: ['#t4_f0', '#t4_f1'],
    5: ['#t5_f0', '#t5_f1'],
  };

  const seqFPS = { 1: 2, 2: 2, 3: 4, 4: 2, 5: 2 };
  const seqState = {};

  function startSequence(i) {
    const plane = seqPlanes[i];
    const frames = seqFrames[i];
    if (!plane || !frames || frames.length === 0) return;
    if (seqState[i]?.timer) return;

    seqState[i] = seqState[i] || { timer: null, frameIndex: 0 };
    const fps = seqFPS[i] || 4;

    plane.setAttribute('visible', true);
    seqState[i].timer = setInterval(() => {
      seqState[i].frameIndex = (seqState[i].frameIndex + 1) % frames.length;
      plane.setAttribute('src', frames[seqState[i].frameIndex]);
    }, 1000 / fps);
  }

  function stopSequence(i) {
    const plane = seqPlanes[i];
    const frames = seqFrames[i];
    if (!seqState[i]) seqState[i] = { timer: null, frameIndex: 0 };

    if (seqState[i].timer) {
      clearInterval(seqState[i].timer);
      seqState[i].timer = null;
    }
    seqState[i].frameIndex = 0;

    if (plane && frames && frames.length) {
      plane.setAttribute('src', frames[0]);
      plane.setAttribute('visible', false);
    }
  }

  function stopAllSequences() {
    Object.keys(seqPlanes).forEach(k => stopSequence(Number(k)));
  }

  let unlocked = false;

  function setVisible(el, visible) {
    if (!el) return;
    el.setAttribute('visible', visible);
  }

  function showThumb(i) {
    // default show thumb, hide video
    setVisible(thumbPlanes[i], true);
    setVisible(videoPlanes[i], false);

    // stop other animations
    stopAllSequences();
    stopT0Layers();

    if (i === 0) {
      // target0: no thumb, only 6-layer seq + optional frame overlay
      setVisible(thumbPlanes[0], false);
      startT0Layers();
      return;
    }

    // target 1..5 sequence overlay
    if (i >= 1 && i <= 5) startSequence(i);
  }

  function showVideo(i) {
    setVisible(thumbPlanes[i], false);
    setVisible(videoPlanes[i], true);
    stopAllSequences();
    stopT0Layers();
  }

  // init
  for (let i = 0; i < 11; i++) {
    setVisible(videoPlanes[i], false);
    setVisible(thumbPlanes[i], i !== 0);
  }
  stopAllSequences();
  stopT0Layers();

  async function unlockVideos() {
    if (unlocked) return;
    unlocked = true;

    // unlock iOS autoplay for videos (targets 1..10)
    for (let i = 1; i < videos.length; i++) {
      const v = videos[i];
      if (!v) continue;
      try {
        await v.play();
        v.pause();
        v.currentTime = 0;
      } catch (e) {}
    }

    btn.style.animation = 'none';
    btn.style.opacity = '0';
    btn.style.pointerEvents = 'none';
    setTimeout(() => {
      if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
    }, 220);
  }

  btn.addEventListener('click', unlockVideos, { once: true });

  targets.forEach((targetEl, i) => {
    if (!targetEl) return;

    // target 0: sequence only, no video
    if (i === 0) {
      targetEl.addEventListener('targetFound', () => {
        if (!unlocked) return;
        showThumb(0);
      });
      targetEl.addEventListener('targetLost', () => {
        stopT0Layers();
      });
      return;
    }

    // targets 1..10: video + seq/thumb
    const v = videos[i];

    if (v) {
      v.addEventListener('playing', () => showVideo(i));
      v.addEventListener('pause',   () => showThumb(i));
      v.addEventListener('ended',   () => showThumb(i));
    }

    targetEl.addEventListener('targetFound', async () => {
      if (!unlocked) return;

      showThumb(i);

      try {
        if (!v) return;
        v.currentTime = 0;
        const p = v.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      } catch (e) {}
    });

    targetEl.addEventListener('targetLost', () => {
      try {
        if (!v) return;
        v.pause();
        v.currentTime = 0;
      } catch (e) {}
      showThumb(i);
    });
  });
</script>

  </script>
</body>
</html>
