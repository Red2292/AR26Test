<!doctype html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    #startBtn {
      position: fixed;
      z-index: 9999;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);

      padding: 16px 26px;
      border-radius: 14px;
      border: none;

      font-size: 16px;
      font-weight: 800;
      letter-spacing: 0.4px;
      text-transform: uppercase;

      color: #fff;
      background: linear-gradient(135deg, #ff7a18, #ff3d81);
      box-shadow: 0 10px 28px rgba(0,0,0,0.35);

      cursor: pointer;
      animation: pulse 1.8s infinite;
      -webkit-tap-highlight-color: transparent;

      transition: opacity 200ms ease;
    }

    @keyframes pulse {
      0%   { transform: translateX(-50%) scale(1); }
      50%  { transform: translateX(-50%) scale(1.06); }
      100% { transform: translateX(-50%) scale(1); }
    }

    #startBtn:active {
      transform: translateX(-50%) scale(0.97);
    }
  </style>
</head>

<body style="margin:0; overflow:hidden;">

  <button id="startBtn" type="button">Tap to Start</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; maxTrack: 1;"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    renderer="colorManagement:true, physicallyCorrectLights"
    color-space="sRGB"
  >
    <a-assets>
      <!-- thumbnails -->
      <img id="thumb0"  src="./assets/Son-Thumb.png" crossorigin="anonymous" />
      <img id="thumb1"  src="./assets/Bao-Thumb.png" crossorigin="anonymous" />
      <img id="thumb2"  src="./assets/Dien-Thumbs.png" crossorigin="anonymous" />
      <img id="thumb3"  src="./assets/Dung-thumb.png" crossorigin="anonymous" />
      <img id="thumb4"  src="./assets/Duy-Thumb.png" crossorigin="anonymous" />
      <img id="thumb5"  src="./assets/Kiet-Thumb.png" crossorigin="anonymous" />
      <img id="thumb6"  src="./assets/Minh-Thumb.png" crossorigin="anonymous" />
      <img id="thumb7"  src="./assets/Phong-Thumb.png" crossorigin="anonymous" />
      <img id="thumb8"  src="./assets/Tin-Thumb.png" crossorigin="anonymous" />
      <img id="thumb9"  src="./assets/Van-Thumb.png" crossorigin="anonymous" />
      <img id="thumb10" src="./assets/Xo-Thumb.png" crossorigin="anonymous" />

      <!-- videos -->
      <video id="vid0"  src="./assets/phoma01.mp4" preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid1"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid2"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid3"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid4"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid5"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid6"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid7"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid8"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid9"  src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="vid10" src="./assets/target.mp4"  preload="auto" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>

      <!-- =========================
           PNG SEQUENCES (EDIT PATHS!)
           - t0: 3 frames (as you had)
           - t1..t6: 6 frames each
           ========================= -->

      <!-- t0-seq (3 frames) -->
      <img id="t0_f0" src="./assets/t0-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t0_f1" src="./assets/t0-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t0_f2" src="./assets/t0-seq/frame_002.png" crossorigin="anonymous" />

      <!-- t1-seq (6 frames) -->
      <img id="t1_f0" src="./assets/t1-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t1_f1" src="./assets/t1-seq/frame_001.png" crossorigin="anonymous" />

      <!-- t2-seq (6 frames) -->
      <img id="t2_f0" src="./assets/t2-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t2_f1" src="./assets/t2-seq/frame_001.png" crossorigin="anonymous" />

      <!-- t3-seq (6 frames) -->
      <img id="t3_f0" src="./assets/t3-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t3_f1" src="./assets/t3-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t3_f2" src="./assets/t3-seq/frame_002.png" crossorigin="anonymous" />

      <!-- t4-seq (6 frames) -->
      <img id="t4_f0" src="./assets/t4-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t4_f1" src="./assets/t4-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t4_f2" src="./assets/t4-seq/frame_002.png" crossorigin="anonymous" />
      <img id="t4_f3" src="./assets/t4-seq/frame_003.png" crossorigin="anonymous" />
      <img id="t4_f4" src="./assets/t4-seq/frame_004.png" crossorigin="anonymous" />
      <img id="t4_f5" src="./assets/t4-seq/frame_005.png" crossorigin="anonymous" />

      <!-- t5-seq (6 frames) -->
      <img id="t5_f0" src="./assets/t5-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t5_f1" src="./assets/t5-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t5_f2" src="./assets/t5-seq/frame_002.png" crossorigin="anonymous" />
      <img id="t5_f3" src="./assets/t5-seq/frame_003.png" crossorigin="anonymous" />
      <img id="t5_f4" src="./assets/t5-seq/frame_004.png" crossorigin="anonymous" />
      <img id="t5_f5" src="./assets/t5-seq/frame_005.png" crossorigin="anonymous" />

      <!-- t6-seq (6 frames) -->
      <img id="t6_f0" src="./assets/t6-seq/frame_000.png" crossorigin="anonymous" />
      <img id="t6_f1" src="./assets/t6-seq/frame_001.png" crossorigin="anonymous" />
      <img id="t6_f2" src="./assets/t6-seq/frame_002.png" crossorigin="anonymous" />
      <img id="t6_f3" src="./assets/t6-seq/frame_003.png" crossorigin="anonymous" />
      <img id="t6_f4" src="./assets/t6-seq/frame_004.png" crossorigin="anonymous" />
      <img id="t6_f5" src="./assets/t6-seq/frame_005.png" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <!-- =========================
         TARGET 0
         - thumb hidden
         - sequence visible by default
         - video on top
         ========================= -->
    <a-entity id="t0" mindar-image-target="targetIndex: 0">
      <a-image id="thumbPlane0" src="#thumb0" position="0 0 0.085" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>

      <a-image id="t0_seqPlane" src="#t0_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>

      <a-video id="videoPlane0" src="#vid0" position="0 0 0.12" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <!-- =========================
         TARGET 1..6
         - thumb + sequence overlay (sequence shown only in thumb mode)
         - video on top
         ========================= -->
    <a-entity id="t1" mindar-image-target="targetIndex: 1">
      <a-image id="thumbPlane1" src="#thumb1" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-image id="t1_seqPlane" src="#t1_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane1" src="#vid1" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t2" mindar-image-target="targetIndex: 2">
      <a-image id="thumbPlane2" src="#thumb2" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-image id="t2_seqPlane" src="#t2_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane2" src="#vid2" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t3" mindar-image-target="targetIndex: 3">
      <a-image id="thumbPlane3" src="#thumb3" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-image id="t3_seqPlane" src="#t3_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane3" src="#vid3" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t4" mindar-image-target="targetIndex: 4">
      <a-image id="thumbPlane4" src="#thumb4" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-image id="t4_seqPlane" src="#t4_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane4" src="#vid4" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t5" mindar-image-target="targetIndex: 5">
      <a-image id="thumbPlane5" src="#thumb5" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-image id="t5_seqPlane" src="#t5_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane5" src="#vid5" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t6" mindar-image-target="targetIndex: 6">
      <a-image id="thumbPlane6" src="#thumb6" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-image id="t6_seqPlane" src="#t6_f0" position="0 0 0.095" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01" visible="false"></a-image>
      <a-video id="videoPlane6" src="#vid6" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <!-- Targets 7-10 (no sequences requested) -->
    <a-entity id="t7" mindar-image-target="targetIndex: 7">
      <a-image id="thumbPlane7" src="#thumb7" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-video id="videoPlane7" src="#vid7" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t8" mindar-image-target="targetIndex: 8">
      <a-image id="thumbPlane8" src="#thumb8" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-video id="videoPlane8" src="#vid8" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t9" mindar-image-target="targetIndex: 9">
      <a-image id="thumbPlane9" src="#thumb9" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-video id="videoPlane9" src="#vid9" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

    <a-entity id="t10" mindar-image-target="targetIndex: 10">
      <a-image id="thumbPlane10" src="#thumb10" position="0 0 0.09" width="1" height="2"
               material="shader: flat; transparent: true; alphaTest: 0.01"></a-image>
      <a-video id="videoPlane10" src="#vid10" position="0 0 0.1" width="1" height="2"
               material="shader: flat" visible="false"></a-video>
    </a-entity>

  </a-scene>

  <script>
    const btn = document.getElementById('startBtn');

    const videos  = Array.from({ length: 11 }, (_, i) => document.getElementById(`vid${i}`));
    const targets = Array.from({ length: 11 }, (_, i) => document.getElementById(`t${i}`));

    const thumbPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`thumbPlane${i}`));
    const videoPlanes = Array.from({ length: 11 }, (_, i) => document.getElementById(`videoPlane${i}`));

    // =========================
    // SEQUENCES CONFIG
    // =========================
    const seqPlanes = {
      0: document.getElementById('t0_seqPlane'),
      1: document.getElementById('t1_seqPlane'),
      2: document.getElementById('t2_seqPlane'),
      3: document.getElementById('t3_seqPlane'),
      4: document.getElementById('t4_seqPlane'),
      5: document.getElementById('t5_seqPlane'),
      6: document.getElementById('t6_seqPlane'),
    };

    const seqFrames = {
      0: ['#t0_f0', '#t0_f1', '#t0_f2'],
      1: ['#t1_f0', '#t1_f1', '#t1_f2', '#t1_f3', '#t1_f4', '#t1_f5'],
      2: ['#t2_f0', '#t2_f1', '#t2_f2', '#t2_f3', '#t2_f4', '#t2_f5'],
      3: ['#t3_f0', '#t3_f1', '#t3_f2', '#t3_f3', '#t3_f4', '#t3_f5'],
      4: ['#t4_f0', '#t4_f1', '#t4_f2', '#t4_f3', '#t4_f4', '#t4_f5'],
      5: ['#t5_f0', '#t5_f1', '#t5_f2', '#t5_f3', '#t5_f4', '#t5_f5'],
      6: ['#t6_f0', '#t6_f1', '#t6_f2', '#t6_f3', '#t6_f4', '#t6_f5'],
    };

    // fps per target (tweak freely)
    const seqFPS = {
      0: 1,
      1: 1,
      2: 1,
      3: 1,
      4: 1,
      5: 1,
      6: 1,
    };

    const seqState = {}; // { i: { timer, frameIndex } }

    function startSequence(i) {
      const plane = seqPlanes[i];
      const frames = seqFrames[i];
      if (!plane || !frames || frames.length === 0) return;

      if (seqState[i]?.timer) return;

      seqState[i] = seqState[i] || { timer: null, frameIndex: 0 };
      const fps = seqFPS[i] || 10;

      // ensure visible
      plane.setAttribute('visible', true);

      seqState[i].timer = setInterval(() => {
        seqState[i].frameIndex = (seqState[i].frameIndex + 1) % frames.length;
        plane.setAttribute('src', frames[seqState[i].frameIndex]);
      }, 1000 / fps);
    }

    function stopSequence(i) {
      const plane = seqPlanes[i];
      const frames = seqFrames[i];
      if (!seqState[i]) seqState[i] = { timer: null, frameIndex: 0 };

      if (seqState[i].timer) {
        clearInterval(seqState[i].timer);
        seqState[i].timer = null;
      }
      seqState[i].frameIndex = 0;

      if (plane && frames && frames.length) {
        plane.setAttribute('src', frames[0]);
        plane.setAttribute('visible', false);
      }
    }

    function stopAllSequences() {
      Object.keys(seqPlanes).forEach(k => stopSequence(Number(k)));
    }

    let unlocked = false;

    function showThumb(i) {
      // default: show thumb, hide video
      thumbPlanes[i].setAttribute('visible', true);
      videoPlanes[i].setAttribute('visible', false);

      // sequences only for 0..6
      stopAllSequences();

      // target 0: hide thumb, use sequence as thumb state
      if (i === 0) {
        thumbPlanes[0].setAttribute('visible', false);
        startSequence(0);
        return;
      }

      // target 1..6: keep thumb visible + show sequence overlay
      if (i >= 1 && i <= 6) {
        startSequence(i);
      }
    }

    function showVideo(i) {
      // hide thumb, show video
      thumbPlanes[i].setAttribute('visible', false);
      videoPlanes[i].setAttribute('visible', true);

      // stop sequences when video plays
      stopAllSequences();
    }

    // init: show thumb for all, but don't run sequences yet (they will run when a target is found)
    for (let i = 0; i < 11; i++) {
      videoPlanes[i].setAttribute('visible', false);
      thumbPlanes[i].setAttribute('visible', i !== 0); // t0 thumb hidden, uses seq when target found
    }
    stopAllSequences();

    async function unlockVideos() {
      if (unlocked) return;
      unlocked = true;

      for (const v of videos) {
        try {
          await v.play();
          v.pause();
          v.currentTime = 0;
        } catch (e) {}
      }

      btn.style.animation = 'none';
      btn.style.opacity = '0';
      btn.style.pointerEvents = 'none';
      setTimeout(() => {
        if (btn && btn.parentNode) btn.parentNode.removeChild(btn);
      }, 220);
    }

    btn.addEventListener('click', unlockVideos, { once: true });

    targets.forEach((targetEl, i) => {
      const v = videos[i];

      v.addEventListener('playing', () => showVideo(i));
      v.addEventListener('pause',   () => showThumb(i));
      v.addEventListener('ended',   () => showThumb(i));

      targetEl.addEventListener('targetFound', async () => {
        if (!unlocked) return;

        // show thumb/sequence state immediately, then play video
        showThumb(i);

        try {
          v.currentTime = 0;
          const p = v.play();
          if (p && typeof p.catch === 'function') p.catch(() => {});
        } catch (e) {}
      });

      targetEl.addEventListener('targetLost', () => {
        try {
          v.pause();
          v.currentTime = 0;
        } catch (e) {}

        // back to thumb state (sequence for 0..6)
        showThumb(i);
      });
    });
  </script>
</body>
</html>
